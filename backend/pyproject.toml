[project]
name = "wingdex-backend"
version = "0.1.0"
description = "Flight data API for Wingdex"
requires-python = ">=3.11"
dependencies = [
    # Lower bounds only. CI's backend-oldest job runs the tests and mypy with
    # exactly these versions on Python 3.11 (.github/workflows/ci.yml; keep in sync).
    "fastapi>=0.115",
    # The API models (app/models.py). 2.8 is the first with wheels for Python 3.13.
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",  # OpenSky client (also what FastAPI's TestClient uses)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.csv.gz"]  # the aircraft type file

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
